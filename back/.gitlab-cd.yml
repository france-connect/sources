build-back-staging:
  extends: .build_job
  stage: 'Build Staging'
  image:  ${FC_DOCKER_REGISTRY}/ci-cd-slim:${DOCKER_VERSION}
  services:
    - name: docker:28-dind
      alias: docker
      command: ["--storage-driver=overlay2"]
  tags:
    - build-fc-nubo
  environment:
    name: staging
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    RELEASE_VERSION: ${CI_COMMIT_REF_NAME}
    APP_VERSION: "staging-${CI_COMMIT_SHA}"
    # Proxy
    PROXY_EXPLOITATION: ${HTTPS_PROXY}
    INTERNET_PROXY: ${HTTPS_PROXY}
  before_script:
    - export PATH="${PATH}:${FC_ROOT}/fc/tools/bin"
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" -u "$CI_DEPENDENCY_PROXY_USER" --password-stdin
    - echo $FC_DOCKER_REGISTRY_PASS | docker login -u $FC_DOCKER_REGISTRY_USER --password-stdin $FC_DOCKER_REGISTRY
  script:
    - docker-stack bake-nodejs-app prod-deps prod-generic csmr-hsm-high command-pre-deploy command-elastic-instance
    - docker-stack bake-mongodb-fixtures
  interruptible: true
