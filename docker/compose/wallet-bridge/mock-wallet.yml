services:
  ####################
  # Mock Wallet OpenID4VP
  ####################
  mock-wallet:
    hostname: mock-wallet
    image: ${FC_DOCKER_REGISTRY}/nodejs:${NODE_VERSION}-dev
    user: ${CURRENT_UID}
    working_dir: /var/www/app
    depends_on:
      node-modules-back:
        condition: service_completed_successfully
      squid:
        condition: service_started
    volumes:
      - "${VOLUMES_DIR}/src/fc/back:/var/www/app"
      - "${VOLUMES_DIR}/app:/opt/scripts"
      - "${VOLUMES_DIR}/log:/var/log/app"
      - "${VOLUMES_DIR}/.home:/home"
      - "${VOLUMES_DIR}/ssl:/etc/ssl/docker_host:ro"
      - "${VOLUMES_DIR}/mock-wallet/identities:/var/mock-wallet/identities:ro"
    env_file:
      - "${COMPOSE_DIR}/shared/.env/base-app.env"
      - "${COMPOSE_DIR}/wallet-bridge/.env/mock-wallet.env"
    tty: true
    networks:
      - public
    init: true
    command: "pm2 logs"
